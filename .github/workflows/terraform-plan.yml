name: terraform-plan

# Runs fmt / validate / plan on PRs that touch the Cloudflare module and posts
# the result as a PR comment. Plan only — never applies. Secrets are available
# for same-repo PRs only (fork PRs run without creds and the plan step is skipped).

on:
  pull_request:
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static analysis needs no credentials, so it runs on fork PRs too.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: tflint
        working-directory: infra/cloudflare
        env:
          # avoids GitHub API rate limits when --init fetches plugins
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --format compact

      - name: trivy misconfiguration scan # tfsec's successor
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/cloudflare
          exit-code: "1"
          severity: MEDIUM,HIGH,CRITICAL

  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.6

      - name: fmt
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      # Cloud credentials scoped to the terraform steps only, so the
      # third-party setup-terraform step never sees them.
      - name: init
        id: init
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -input=false

      - name: validate
        id: validate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform validate -no-color

      - name: plan
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform plan -input=false -no-color -lock=false
        continue-on-error: true

      - name: comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const max = 60000;
            let plan = (process.env.PLAN || "(no output)").trim();
            if (plan.length > max) plan = plan.slice(0, max) + "\n... (truncated)";
            const body = [
              "### Terraform plan",
              "",
              "| step | result |",
              "| --- | --- |",
              "| fmt | `${{ steps.fmt.outcome }}` |",
              "| init | `${{ steps.init.outcome }}` |",
              "| validate | `${{ steps.validate.outcome }}` |",
              "| plan | `${{ steps.plan.outcome }}` |",
              "",
              "<details><summary>Show plan</summary>",
              "",
              "```terraform",
              plan,
              "```",
              "</details>",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const prev = comments.find(
              (c) => c.user.type === "Bot" && c.body.startsWith("### Terraform plan"),
            );
            if (prev) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: |
          echo "terraform plan failed — see the PR comment for details"
          exit 1
