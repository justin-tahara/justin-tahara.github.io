name: terraform-plan

# Runs fmt / validate / plan on PRs that touch the Cloudflare module and posts
# the result as a PR comment. Plan only — never applies.
#
# Two tiers, because only same-repo human PRs can reach the secrets:
#   lint  — always runs. fmt, tflint, trivy, and init -backend=false + validate.
#           No credentials, so it works on fork and Dependabot PRs.
#   plan  — needs the R2 backend and the Cloudflare API, so it runs only where
#           the Actions secrets resolve (see the job's own comment).

on:
  pull_request:
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static analysis needs no credentials, so it runs on fork and Dependabot PRs
  # too — which is the only signal a provider-bump PR gets.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.6

      - name: fmt
        run: terraform fmt -check -recursive

      # -backend=false skips the R2 backend (the part that needs credentials)
      # while still downloading providers, which is what validate needs. This is
      # the real gate on a provider bump: it catches a version whose schema no
      # longer matches the config.
      - name: init (no backend) and validate
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: tflint
        env:
          # avoids GitHub API rate limits when --init fetches plugins
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --format compact

      - name: trivy misconfiguration scan # tfsec's successor
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/cloudflare
          exit-code: "1"
          severity: MEDIUM,HIGH,CRITICAL

  plan:
    # The R2 backend and the Cloudflare API need the Actions secrets, and those
    # resolve to empty for anything but a same-repo human PR:
    #   - fork PRs get no secrets at all
    #   - Dependabot PRs read a SEPARATE Dependabot secrets store
    # Without this guard the job fails at `init` with "No valid credential
    # sources found" on every Dependabot bump. Withholding the credentials is
    # also deliberate: init/plan execute the provider binary, so a PR whose
    # whole purpose is changing which provider version runs must never hold the
    # live Cloudflare token. `lint` still covers those PRs credential-free.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.6

      # fmt and validate live in `lint`; this job is only the credentialed part.
      # Credentials are scoped to the terraform steps themselves, so the
      # third-party setup-terraform step never sees them.
      - name: init
        id: init
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -input=false

      - name: plan
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform plan -input=false -no-color -lock=false
        continue-on-error: true

      - name: comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const max = 60000;
            let plan = (process.env.PLAN || "(no output)").trim();
            if (plan.length > max) plan = plan.slice(0, max) + "\n... (truncated)";
            const body = [
              "### Terraform plan",
              "",
              "| step | result |",
              "| --- | --- |",
              "| init | `${{ steps.init.outcome }}` |",
              "| plan | `${{ steps.plan.outcome }}` |",
              "",
              "fmt / validate / tflint / trivy report separately in the `lint` check.",
              "",
              "<details><summary>Show plan</summary>",
              "",
              "```terraform",
              plan,
              "```",
              "</details>",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const prev = comments.find(
              (c) => c.user.type === "Bot" && c.body.startsWith("### Terraform plan"),
            );
            if (prev) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: |
          echo "terraform plan failed — see the PR comment for details"
          exit 1
