name: edge-verify

# Verifies the LIVE edge behaves the way infra/cloudflare/ says it should.
# terraform-apply proves the API accepted the config; this proves the site
# actually serves it: redirects, security headers, TLS floor, edge cache.
#
# Runs after every successful terraform-apply, on a daily schedule (doubling
# as an uptime check), and on demand. Pure curl — no creds, no state access.

on:
  workflow_run:
    workflows: [terraform-apply]
    types: [completed]
  schedule:
    - cron: "17 15 * * *" # daily; minute chosen off the hour to avoid cron spikes
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    # For workflow_run triggers, only verify after an apply that succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      HOST: justintahara.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: site is up (HTTPS, 200, real content)
        run: |
          body=$(curl -sS --fail --max-time 30 "https://$HOST/")
          echo "$body" | grep -q "Justin Tahara"

      - name: http -> https redirect
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "http://$HOST/")
          loc=$(curl -sSI --max-time 30 "http://$HOST/" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
          echo "code=$code location=$loc"
          [ "$code" = "301" ] || [ "$code" = "308" ]
          case "$loc" in https://*) ;; *) echo "not upgraded to https"; exit 1;; esac

      - name: www -> apex redirect preserves path
        run: |
          loc=$(curl -sSI --max-time 30 "https://www.$HOST/about" \
            | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
          echo "location=$loc"
          [ "$loc" = "https://$HOST/about" ]

      - name: legacy URLs 301 into /archive/ (full redirect map)
        run: |
          declare -A map=(
            [/Amazon.html]=/archive/experience/amazon.html
            [/AppliedIntuition.html]=/archive/experience/applied-intuition.html
            [/CHP.html]=/archive/experience/chp.html
            [/NIWC.html]=/archive/experience/niwc.html
            [/Onyx.html]=/archive/experience/onyx.html
            [/UCSD.html]=/archive/experience/ucsd.html
            [/WD.html]=/archive/experience/wd.html
            [/experience/amazon.html]=/archive/experience/amazon.html
            [/resume/Justin_Tahara_2025_Resume.pdf]=/archive/resume/Justin_Tahara_2025_Resume.pdf
          )
          fail=0
          for from in "${!map[@]}"; do
            want="https://$HOST${map[$from]}"
            got=$(curl -sSI --max-time 30 "https://$HOST$from" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
            if [ "$got" = "$want" ]; then
              echo "ok   $from -> $got"
            else
              echo "FAIL $from -> ${got:-<no redirect>} (want $want)"
              fail=1
            fi
          done
          exit $fail

      - name: security headers present
        run: |
          headers=$(curl -sSI --max-time 30 "https://$HOST/" | tr -d '\r')
          fail=0
          for h in \
            "strict-transport-security" \
            "content-security-policy" \
            "x-content-type-options" \
            "referrer-policy" \
            "permissions-policy" \
            "cross-origin-opener-policy"; do
            if echo "$headers" | grep -qi "^$h:"; then
              echo "ok   $h"
            else
              echo "FAIL missing $h"
              fail=1
            fi
          done
          # HSTS must carry the long max-age we set in security.tf
          echo "$headers" | grep -qi "^strict-transport-security:.*max-age=31536000" || { echo "FAIL hsts max-age"; fail=1; }
          exit $fail

      - name: TLS floor is 1.2 (1.0/1.1 rejected)
        run: |
          if curl -sS --tls-max 1.1 --max-time 30 -o /dev/null "https://$HOST/" 2>/dev/null; then
            echo "FAIL: TLS 1.1 handshake was accepted"
            exit 1
          fi
          echo "ok: TLS <=1.1 rejected"

      - name: static assets are edge-cached
        run: |
          url="https://$HOST/assets/css/portfolio.css"
          curl -sS -o /dev/null "$url"   # warm the cache
          status=$(curl -sSI --max-time 30 "$url" | tr -d '\r' | awk 'tolower($1)=="cf-cache-status:"{print $2}')
          echo "cf-cache-status=$status"
          case "$status" in
            HIT|MISS|EXPIRED|REVALIDATED) ;;                       # proxied + cache rule active
            *) echo "FAIL: no cf-cache-status header (not proxied, or cache rule missing)"; exit 1;;
          esac

      # The photos host is the site's real single point of failure: if
      # manifest.json 404s or serves bad JSON, every view renders the error
      # state. Verify the whole contract, not just the apex.
      - name: photos manifest is live, valid JSON, non-empty
        run: |
          curl -sS --fail --max-time 30 "https://images.$HOST/manifest.json" -o /tmp/manifest.json
          python3 - <<'PY'
          import json
          m = json.load(open("/tmp/manifest.json"))
          rolls = m["rolls"]
          assert isinstance(rolls, dict) and rolls, "manifest has no rolls"
          photos = sum(len(v) for v in rolls.values())
          assert photos > 0, "manifest lists zero photos"
          print(f"ok: {len(rolls)} rolls, {photos} photos")
          PY

      - name: manifest is not pinned at the edge
        run: |
          # The 5-minute TTL (edge.tf cache_photos_manifest) must hold in
          # practice — the 30-day host rule pinning the manifest is how newly
          # synced photos silently stop appearing.
          age=$(curl -sSI --max-time 30 "https://images.$HOST/manifest.json" | tr -d '\r' | awk 'tolower($1)=="age:"{print $2}')
          echo "age=${age:-<none>}"
          [ -z "$age" ] || [ "$age" -le 600 ] || { echo "FAIL: manifest pinned at the edge (age ${age}s)"; exit 1; }

      - name: photo variants serve immutable from the edge
        run: |
          url=$(python3 -c 'import json; m=json.load(open("/tmp/manifest.json")); roll=sorted(m["rolls"])[0]; p=m["rolls"][roll][0]; print(sorted(p["variants"].values())[0])')
          echo "probe: $url"
          headers=$(curl -sSI --fail --max-time 30 "$url" | tr -d '\r')
          echo "$headers" | grep -qi "^cache-control:.*immutable" || { echo "FAIL: variant missing immutable cache-control"; exit 1; }
          echo "$headers" | grep -qi "^cf-cache-status:" || { echo "FAIL: variant not proxied (no cf-cache-status)"; exit 1; }

      - name: photos host answers CORS preflight from the apex
        run: |
          allow=$(curl -sS --max-time 30 -X OPTIONS "https://images.$HOST/manifest.json" \
            -H "Origin: https://$HOST" -H "Access-Control-Request-Method: GET" \
            -D - -o /dev/null | tr -d '\r' | awk 'tolower($1)=="access-control-allow-origin:"{print $2}')
          echo "access-control-allow-origin=${allow:-<none>}"
          [ "$allow" = "https://$HOST" ] || [ "$allow" = "*" ]

      # Same alerting pattern as terraform-drift: failures open/update a single
      # labeled issue, the next green run closes it. Without this, a red daily
      # run (this is the de-facto uptime check) notifies no one.
      - name: open/update or close the edge-verify issue
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const failed = process.env.JOB_STATUS === "failure";
            const title = "edge-verify failing: live edge does not match infra/cloudflare/";
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "edge-verify",
            });
            const existing = open.find((i) => i.title === title);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (!failed) {
              if (existing) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: existing.number,
                  body: "Latest [edge-verify run](" + run + ") is green. Closing.",
                });
                await github.rest.issues.update({
                  ...context.repo, issue_number: existing.number, state: "closed",
                });
              }
              return;
            }

            const body = [
              "The [edge-verify run](" + run + ") failed — the site is down or the live edge no longer matches `infra/cloudflare/`.",
              "",
              "Check the run log for which assertion failed (uptime, redirects, security headers, TLS floor, or edge cache).",
            ].join("\n");

            if (existing) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ["edge-verify"],
              });
            }
