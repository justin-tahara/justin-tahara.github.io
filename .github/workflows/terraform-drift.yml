name: terraform-drift

# Weekly drift check: does the live Cloudflare config still match the code?
# Dashboard click-ops are the classic way edge-as-code rots — this catches it.
#
# `terraform plan -detailed-exitcode` returns 0 (clean), 1 (error), 2 (drift).
# On drift the run fails and a single "drift detected" issue is opened or
# updated with the plan; a clean run closes it.

on:
  schedule:
    - cron: "43 15 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: terraform-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      # Cloud credentials scoped to the terraform steps only, so the
      # third-party setup-terraform step never sees them.
      - name: init
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -input=false

      - name: plan (detect drift)
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode 2>&1 | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = clean, 2 = drift: both handled below. 1 = plan itself broke.
          [ "$code" != "1" ]

      - name: open/update or close the drift issue
        uses: actions/github-script@v7
        env:
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require("fs");
            const drifted = process.env.EXITCODE === "2";
            const title = "Terraform drift detected: live Cloudflare config != code";
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "terraform-drift",
            });
            const existing = open.find((i) => i.title === title);

            if (!drifted) {
              if (existing) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: existing.number,
                  body: "Drift is gone — latest scheduled plan is clean. Closing.",
                });
                await github.rest.issues.update({
                  ...context.repo, issue_number: existing.number, state: "closed",
                });
              }
              return;
            }

            const max = 60000;
            let plan = fs.readFileSync("infra/cloudflare/plan.txt", "utf8").trim();
            if (plan.length > max) plan = plan.slice(0, max) + "\n... (truncated)";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The weekly [drift check](" + run + ") found the live Cloudflare zone no longer matches `infra/cloudflare/`.",
              "",
              "Either revert the dashboard change, or codify it and merge (plan -> gated apply).",
              "",
              "<details><summary>Show plan</summary>",
              "",
              "```terraform",
              plan,
              "```",
              "</details>",
            ].join("\n");

            if (existing) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ["terraform-drift"],
              });
            }

      - name: fail the run on drift
        if: steps.plan.outputs.exitcode == '2'
        run: |
          echo "drift detected — see the terraform-drift issue"
          exit 1
