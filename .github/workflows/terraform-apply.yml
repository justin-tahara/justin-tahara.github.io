name: terraform-apply

# Applies the Cloudflare module when changes land on main, completing the
# plan(on PR) -> apply(on merge) loop. Gated by the "production" GitHub
# Environment: the apply pauses for a manual approval before it runs, so edge
# changes (DNS proxy, redirects, headers) never go live unattended. Configure
# required reviewers in repo Settings > Environments > production.

on:
  push:
    branches: [main]
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two applies against the same remote state at once, and never cancel
# an apply mid-flight (that can leave a lock / partial state).
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: init
        run: terraform init -input=false

      - name: apply
        run: terraform apply -input=false -auto-approve
