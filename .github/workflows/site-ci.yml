name: site-ci

# Quality gate for the static site. GitHub Pages deploys straight from main with
# no build, so this is the only thing standing between a bad commit and prod.
# Runs on PRs that touch site content (not infra-only or workflow-only changes).

on:
  pull_request:
    paths:
      - "**/*.html"
      - "assets/**"
      - "scripts/**"
      - "infra/cloudflare/scripts/**"
      - ".github/workflows/site-ci.yml"
      - ".htmlvalidate.json"
      - "lighthouserc.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Internal links are the real restructure risk; social/auth-walled
          # hosts answer bots with 403/999, so exclude them to avoid flakiness.
          # --root-dir resolves the portfolio's root-relative links (/assets/…).
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}
            --exclude 'mailto:' --exclude linkedin.com --exclude instagram.com
            "index.html" "archive/index.html" "archive/experience/**/*.html"
          fail: true

  html:
    name: html validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: html-validate
        run: npx --yes html-validate@9 index.html 404.html archive/index.html "archive/experience/**/*.html"

  spa-fallback:
    name: 404 fallback in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub Pages serves 404.html for deep links (/city/…); the portfolio
      # relies on it being a byte-identical copy of index.html.
      - name: 404.html matches index.html
        run: diff index.html 404.html

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The publish pipeline (sync-photos.sh) deploys straight to prod with no
      # other CI signal — shellcheck is the only gate it has.
      - name: shellcheck
        run: shellcheck scripts/*.sh infra/cloudflare/scripts/*.sh

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    # Informational: reports perf/a11y/SEO/best-practices on every PR. Thresholds
    # are "warn" (see lighthouserc.json) so scores are visible without blocking;
    # flip to "error" once a baseline is established. Note: CI scores run without
    # the Cloudflare edge headers, so production best-practices will score higher.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
